<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JSON Tree Viewer - Premium UI/UX</title>
  <style>
    /* CSS Variables for theming */
    :root {
      --color-bg-light: #fefefe;
      --color-bg-dark: #1e1e1e;
      --color-text-light: #333;
      --color-text-dark: #ddd;
      --color-primary: #4f46e5;
      --color-primary-hover: #4338ca;
      --color-error: #ef4444;
      --color-border: #e2e8f0;
      --color-border-dark: #3a3a3a;
      --color-shadow: rgba(0,0,0,0.1);
      --font-mono: "Fira Mono", "Source Code Pro", monospace;
    }
    /* Dark mode */
    body.dark {
      --color-bg: var(--color-bg-dark);
      --color-text: var(--color-text-dark);
      --color-border-current: var(--color-border-dark);
      --color-shadow-current: rgba(0,0,0,0.7);
      --color-input-bg: #2a2a2a;
      --color-input-border: #444;
      --color-value-string: #9cdcfe;
      --color-value-number: #b5cea8;
      --color-value-boolean: #dcdcaa;
      --color-value-null: #808080;
      --color-key: #569cd6;
    }
    /* Light mode */
    body:not(.dark) {
      --color-bg: var(--color-bg-light);
      --color-text: var(--color-text-light);
      --color-border-current: var(--color-border);
      --color-shadow-current: var(--color-shadow);
      --color-input-bg: #fff;
      --color-input-border: #ccc;
      --color-value-string: #a31515;
      --color-value-number: #098658;
      --color-value-boolean: #795e26;
      --color-value-null: #6a737d;
      --color-key: #001080;
    }
    /* Reset and base */
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0; padding: 0; height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    header {
      background: var(--color-primary);
      color: white;
      font-weight: 700;
      font-size: 1.5rem;
      padding: 1rem 1.5rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px var(--color-shadow-current);
    }
    header h1 {
      margin: 0;
      user-select: text;
    }
    /* Dark mode toggle */
    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
      display: inline-block;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      border-radius: 34px;
      transition: background-color 0.3s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    input:checked + .slider {
      background-color: var(--color-primary);
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    .toggle-label {
      color: white;
      font-size: 0.9rem;
      user-select: none;
      margin-left: 0.5rem;
    }
    #container {
      flex: 1;
      display: flex;
      height: calc(100vh - 72px);
      overflow: hidden;
      position: relative;
    }
    /* Split pane container */
    #split-pane {
      display: flex;
      flex-grow: 1;
      height: 100%;
      overflow: hidden;
    }
    /* Resizable sidebar */
    #sidebar {
      width: 40%;
      min-width: 280px;
      max-width: 70%;
      background: var(--color-bg);
      border-right: 1px solid var(--color-border-current);
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      overflow: hidden;
      user-select: text;
    }
    #sidebar.collapsed {
      width: 0;
      min-width: 0;
      border: none;
      user-select: none;
    }
    #sidebar-header {
      padding: 1rem 1.25rem;
      font-weight: 600;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--color-border-current);
      background: var(--color-bg);
      user-select: text;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #json-input {
      flex-grow: 1;
      width: 100%;
      font-family: var(--font-mono);
      font-size: 14px;
      padding: 1rem 1.25rem;
      border: none;
      outline: none;
      resize: none;
      background: var(--color-input-bg);
      color: var(--color-text);
      border-bottom: 1px solid var(--color-border-current);
      overflow: auto;
    }
    #json-input::selection {
      background: var(--color-primary);
      color: white;
    }
    #controls {
      padding: 0.75rem 1.25rem;
      background: var(--color-bg);
      border-top: 1px solid var(--color-border-current);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: var(--color-primary);
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background-color 0.2s ease;
      user-select: none;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    button:hover:not(:disabled),
    button:focus:not(:disabled) {
      background: var(--color-primary-hover);
      outline: none;
    }
    button svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    #error-message {
      color: var(--color-error);
      font-weight: 600;
      min-height: 1.2em;
      text-align: center;
      padding: 0.25rem 1rem;
      user-select: text;
    }
    /* Draggable resizer */
    #resizer {
      width: 8px;
      cursor: col-resize;
      background: transparent;
      position: relative;
      z-index: 10;
      transition: background-color 0.2s ease;
    }
    #resizer:hover {
      background: var(--color-primary);
      opacity: 0.15;
    }
    #resizer:active {
      background: var(--color-primary);
      opacity: 0.3;
    }
    /* Tree viewer */
    #tree-viewer {
      flex-grow: 1;
      background: var(--color-bg);
      padding: 1rem 1.5rem;
      overflow: auto;
      font-family: var(--font-mono);
      font-size: 14px;
      user-select: text;
      color: var(--color-text);
      position: relative;
    }
    /* Tree root */
    ul.json-tree {
      list-style: none;
      padding-left: 1rem;
      margin: 0;
    }
    ul.json-tree ul {
      margin-left: 1rem;
      border-left: 1px dotted var(--color-border-current);
      padding-left: 0.75rem;
      max-height: 10000px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
    }
    .node {
      position: relative;
      margin: 4px 0;
      line-height: 1.3;
      outline: none;
      user-select: none;
    }
    .node.collapsible > .toggle {
      cursor: pointer;
      user-select: none;
      display: inline-block;
      width: 1.1rem;
      color: var(--color-border-current);
      transition: transform 0.3s ease;
      vertical-align: middle;
      user-select: none;
    }
    .node.collapsible > .toggle::before {
      content: "▶";
      display: inline-block;
      transform-origin: center;
    }
    .node.collapsible.expanded > .toggle::before {
      transform: rotate(90deg);
    }
    .key {
      color: var(--color-key);
      font-weight: 600;
      vertical-align: middle;
      user-select: text;
    }
    .value {
      margin-left: 0.4rem;
      vertical-align: middle;
      border-radius: 4px;
      padding: 0 6px;
      transition: background-color 0.2s ease;
      display: inline-block;
      max-width: 80vw;
      word-break: break-word;
      user-select: text;
      cursor: default;
    }
    .value.string {
      color: var(--color-value-string);
      background-color: rgba(156, 220, 254, 0.15);
    }
    .value.number {
      color: var(--color-value-number);
    }
    .value.boolean {
      color: var(--color-value-boolean);
      font-weight: 700;
    }
    .value.null {
      color: var(--color-value-null);
      font-style: italic;
    }
    .value.editable:hover,
    .value.editable:focus-visible {
      background-color: rgba(99, 102, 241, 0.15);
      outline: 2px solid var(--color-primary);
      cursor: text;
      user-select: text;
    }
    input.edit-input {
      font-family: var(--font-mono);
      font-size: 14px;
      border: 1.5px solid var(--color-primary);
      border-radius: 4px;
      padding: 0 8px;
      min-width: 70px;
      max-width: 80vw;
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.5);
      color: var(--color-text);
      background: var(--color-input-bg);
    }
    input.edit-input:focus {
      outline: none;
    }
    /* Smooth collapse/expand */
    .node.collapsible > ul {
      max-height: 10000px;
      opacity: 1;
    }
    .node.collapsible:not(.expanded) > ul {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }
    /* Collapsed sidebar toggle button */
    #sidebar-toggle {
      position: absolute;
      top: 1rem;
      left: 100%;
      transform: translateX(-50%);
      background: var(--color-primary);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 2px 6px var(--color-shadow-current);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
      user-select: none;
      z-index: 20;
    }
    #sidebar-toggle:hover,
    #sidebar-toggle:focus {
      background: var(--color-primary-hover);
      outline: none;
    }
    #sidebar.collapsed + #sidebar-toggle {
      left: 0;
      transform: translateX(50%);
    }
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--color-bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--color-primary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-primary-hover);
    }
    /* Responsive */
    @media (max-width: 768px) {
      #sidebar {
        width: 100%;
        max-width: 100%;
        height: 50vh;
        border-right: none;
        border-bottom: 1px solid var(--color-border-current);
        overflow-y: auto;
      }
      #split-pane {
        flex-direction: column;
        height: 100%;
      }
      #resizer {
        width: 100%;
        height: 8px;
        cursor: row-resize;
        background: transparent;
      }
      #resizer:hover {
        background: var(--color-primary);
        opacity: 0.15;
      }
      #resizer:active {
        background: var(--color-primary);
        opacity: 0.3;
      }
      #tree-viewer {
        height: 50vh;
        padding: 1rem;
        overflow-y: auto;
      }
      #sidebar-toggle {
        top: auto;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>JSON Tree Viewer</h1>
    <label class="toggle-switch" title="Toggle dark mode" aria-label="Toggle dark mode">
      <input type="checkbox" id="dark-mode-toggle" />
      <span class="slider"></span>
    </label>
  </header>
  <div id="container">
    <div id="split-pane">
      <aside id="sidebar" role="region" aria-label="JSON input panel">
        <div id="sidebar-header">
          JSON Input
          <button id="collapse-sidebar" aria-label="Collapse JSON input panel" title="Collapse JSON input panel" tabindex="0" style="background:none; border:none; color: var(--color-primary); font-weight: 700; font-size: 1.2rem; cursor:pointer; user-select:none;">×</button>
        </div>
        <textarea id="json-input" spellcheck="false" aria-multiline="true" aria-label="JSON input editor" placeholder="Paste your JSON data here..." rows="15" autocomplete="off" autocorrect="off" autocapitalize="off" ></textarea>
        <div id="controls" role="group" aria-label="JSON controls">
          <button id="load-json" title="Load JSON data from input" aria-describedby="error-message">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2L12 16M12 16L8 12M12 16L16 12M4 20H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Load JSON
          </button>
          <button id="download-json" title="Download updated JSON" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16L12 2M12 16L8 12M12 16L16 12M4 20H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download JSON
          </button>
          <button id="expand-all" title="Expand all nodes">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12H21M12 3L12 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Expand All
          </button>
          <button id="collapse-all" title="Collapse all nodes">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Collapse All
          </button>
        </div>
        <div id="error-message" role="alert" aria-live="assertive" aria-atomic="true"></div>
      </aside>
      <div id="resizer" aria-label="Resize JSON input panel" role="separator" tabindex="0"></div>
      <main id="tree-viewer" role="tree" aria-label="JSON Tree Viewer" tabindex="0"></main>
    </div>
    <button id="sidebar-toggle" aria-label="Toggle JSON input panel" title="Toggle JSON input panel" aria-expanded="true">‹</button>
  </div>
  <footer>
    Click on values to edit inline. Press Enter or click outside to save. Use keyboard arrows to navigate. Dark mode toggle in header.
  </footer>
  <script>
    (() => {
      const body = document.body;
      const darkToggle = document.getElementById('dark-mode-toggle');
      const inputArea = document.getElementById('json-input');
      const loadBtn = document.getElementById('load-json');
      const downloadBtn = document.getElementById('download-json');
      const expandAllBtn = document.getElementById('expand-all');
      const collapseAllBtn = document.getElementById('collapse-all');
      const treeViewer = document.getElementById('tree-viewer');
      const errorMessage = document.getElementById('error-message');
      const sidebar = document.getElementById('sidebar');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const collapseSidebarBtn = document.getElementById('collapse-sidebar');
      const resizer = document.getElementById('resizer');
      let jsonData = null;

      // Load dark mode preference
      if (localStorage.getItem('darkMode') === 'true') {
        body.classList.add('dark');
        darkToggle.checked = true;
      }
      darkToggle.addEventListener('change', () => {
        if (darkToggle.checked) {
          body.classList.add('dark');
          localStorage.setItem('darkMode', 'true');
        } else {
          body.classList.remove('dark');
          localStorage.setItem('darkMode', 'false');
        }
      });

      // Sidebar toggle
      function collapseSidebar() {
        sidebar.classList.add('collapsed');
        sidebarToggle.setAttribute('aria-expanded', 'false');
        sidebarToggle.textContent = '›';
        sidebarToggle.focus();
      }
      function expandSidebar() {
        sidebar.classList.remove('collapsed');
        sidebarToggle.setAttribute('aria-expanded', 'true');
        sidebarToggle.textContent = '‹';
        sidebarToggle.focus();
      }
      sidebarToggle.addEventListener('click', () => {
        if (sidebar.classList.contains('collapsed')) {
          expandSidebar();
        } else {
          collapseSidebar();
        }
      });
      collapseSidebarBtn.addEventListener('click', () => {
        collapseSidebar();
      });

      // Resizer drag logic
      let isResizing = false;
      let lastDownX = 0;
      resizer.addEventListener('mousedown', e => {
        isResizing = true;
        lastDownX = e.clientX;
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
      });
      window.addEventListener('mousemove', e => {
        if (!isResizing) return;
        let offsetRight = document.body.clientWidth - (e.clientX);
        let newWidth = e.clientX;
        if (newWidth < 280) newWidth = 280;
        if (newWidth > document.body.clientWidth * 0.7) newWidth = document.body.clientWidth * 0.7;
        sidebar.style.width = newWidth + 'px';
      });
      window.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          document.body.style.cursor = '';
        }
      });
      // Keyboard support for resizer
      resizer.addEventListener('keydown', e => {
        const step = 20;
        let width = sidebar.offsetWidth;
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          width -= step;
          if (width < 280) width = 280;
          sidebar.style.width = width + 'px';
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          width += step;
          if (width > document.body.clientWidth * 0.7) width = document.body.clientWidth * 0.7;
          sidebar.style.width = width + 'px';
        }
      });

      // Tree creation
      function createTree(data, key = null) {
        const ul = document.createElement('ul');
        ul.classList.add('json-tree');

        if (typeof data === 'object' && data !== null) {
          const isArray = Array.isArray(data);
          for (const k in data) {
            if (Object.prototype.hasOwnProperty.call(data, k)) {
              const li = document.createElement('li');
              li.classList.add('node');
              li.setAttribute('role', 'treeitem');
              li.setAttribute('tabindex', '-1');
              li.setAttribute('aria-expanded', 'true');

              const value = data[k];
              const hasChildren = typeof value === 'object' && value !== null && (Object.keys(value).length > 0);

              if (hasChildren) {
                li.classList.add('collapsible', 'expanded');
                li.setAttribute('aria-expanded', 'true');
                const toggle = document.createElement('span');
                toggle.classList.add('toggle');
                toggle.setAttribute('aria-label', 'Toggle expand/collapse');
                toggle.tabIndex = 0;
                toggle.addEventListener('click', () => {
                  li.classList.toggle('expanded');
                  const expanded = li.classList.contains('expanded');
                  li.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                });
                toggle.addEventListener('keydown', e => {
                  if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    li.classList.toggle('expanded');
                    const expanded = li.classList.contains('expanded');
                    li.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                  }
                });
                li.appendChild(toggle);
              } else {
                // Indent for alignment with toggles
                const spacer = document.createElement('span');
                spacer.style.display = 'inline-block';
                spacer.style.width = '1.1rem';
                li.appendChild(spacer);
              }

              // Key display
              const keySpan = document.createElement('span');
              keySpan.classList.add('key');
              if (isArray) {
                keySpan.textContent = `[${k}]`;
              } else {
                keySpan.textContent = k;
              }
              li.appendChild(keySpan);

              // Colon separator
              li.appendChild(document.createTextNode(': '));

              // Value display
              if (hasChildren) {
                const childTree = createTree(value);
                li.appendChild(childTree);
              } else {
                const valSpan = document.createElement('span');
                valSpan.classList.add('value');
                valSpan.classList.add(getTypeClass(value));
                valSpan.textContent = stringifyValue(value);
                valSpan.classList.add('editable');
                valSpan.tabIndex = 0;
                valSpan.setAttribute('role', 'textbox');
                valSpan.setAttribute('aria-label', `Value for key ${k}`);
                valSpan.addEventListener('click', () => {
                  editValue(valSpan, data, k);
                });
                valSpan.addEventListener('keydown', e => {
                  if (e.key === 'Enter') {
                    e.preventDefault();
                    editValue(valSpan, data, k);
                  }
                });
                li.appendChild(valSpan);
              }

              ul.appendChild(li);
            }
          }
        } else {
          // Primitive root data
          const li = document.createElement('li');
          li.classList.add('node');
          li.setAttribute('role', 'treeitem');
          li.setAttribute('tabindex', '0');
          const valSpan = document.createElement('span');
          valSpan.classList.add('value');
          valSpan.classList.add(getTypeClass(data));
          valSpan.textContent = stringifyValue(data);
          valSpan.classList.add('editable');
          valSpan.tabIndex = 0;
          valSpan.setAttribute('role', 'textbox');
          valSpan.setAttribute('aria-label', 'Root value');
          valSpan.addEventListener('click', () => {
            editValue(valSpan, {root: data}, 'root');
          });
          valSpan.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
              e.preventDefault();
              editValue(valSpan, {root: data}, 'root');
            }
          });
          li.appendChild(valSpan);
          ul.appendChild(li);
        }

        return ul;
      }

      function stringifyValue(value) {
        if (typeof value === 'string') return `"${value}"`;
        if (value === null) return 'null';
        return String(value);
      }

      function getTypeClass(value) {
        if (value === null) return 'null';
        if (typeof value === 'string') return 'string';
        if (typeof value === 'number') return 'number';
        if (typeof value === 'boolean') return 'boolean';
        return '';
      }

      function editValue(span, parentObj, key) {
        if (span.querySelector('input')) return; // already editing

        const oldValueText = span.textContent;
        const oldValueRaw = parentObj[key];

        const input = document.createElement('input');
        input.type = 'text';
        input.classList.add('edit-input');
        input.value = oldValueText.replace(/^"(.*)"$/, '$1'); // remove quotes if string
        span.textContent = '';
        span.appendChild(input);
        input.focus();
        input.select();

        function save() {
          let newValue = input.value.trim();
          if (newValue === '') {
            alert('Value cannot be empty.');
            input.focus();
            return;
          }
          // Try to parse JSON value (number, boolean, null, string)
          try {
            if (
              newValue === 'null' ||
              newValue === 'true' ||
              newValue === 'false' ||
              (!isNaN(newValue) && newValue !== '')
            ) {
              newValue = JSON.parse(newValue);
            } else {
              newValue = newValue;
            }
          } catch {
            newValue = newValue;
          }

          parentObj[key] = newValue;

          span.className = 'value editable ' + getTypeClass(newValue);
          span.textContent = stringifyValue(newValue);
        }

        input.addEventListener('blur', () => {
          save();
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            save();
            span.focus();
          }
          if (e.key === 'Escape') {
            span.textContent = oldValueText;
            span.focus();
          }
        });
      }

      function renderTree() {
        treeViewer.innerHTML = '';
        if (!jsonData) return;
        const tree = createTree(jsonData);
        treeViewer.appendChild(tree);
        downloadBtn.disabled = false;
      }

      loadBtn.addEventListener('click', () => {
        errorMessage.textContent = '';
        try {
          jsonData = JSON.parse(inputArea.value);
          renderTree();
        } catch (e) {
          errorMessage.textContent = 'Invalid JSON: ' + e.message;
          treeViewer.innerHTML = '';
          jsonData = null;
          downloadBtn.disabled = true;
        }
      });

      downloadBtn.addEventListener('click', () => {
        if (!jsonData) {
          alert('No JSON data to download.');
          return;
        }
        const blob = new Blob([JSON.stringify(jsonData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'updated.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 0);
      });

      expandAllBtn.addEventListener('click', () => {
        const nodes = treeViewer.querySelectorAll('.collapsible');
        nodes.forEach(node => {
          node.classList.add('expanded');
          node.setAttribute('aria-expanded', 'true');
        });
      });

      collapseAllBtn.addEventListener('click', () => {
        const nodes = treeViewer.querySelectorAll('.collapsible');
        nodes.forEach(node => {
          node.classList.remove('expanded');
          node.setAttribute('aria-expanded', 'false');
        });
      });

      // Keyboard navigation for tree items
      treeViewer.addEventListener('keydown', e => {
        const focusElem = document.activeElement;
        if (!treeViewer.contains(focusElem)) return;
        if (!focusElem.classList.contains('node')) return;

        let nodes = Array.from(treeViewer.querySelectorAll('.node'));
        let index = nodes.indexOf(focusElem);

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (index < nodes.length - 1) {
            nodes[index + 1].focus();
          }
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (index > 0) {
            nodes[index - 1].focus();
          }
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          if (focusElem.classList.contains('collapsible') && !focusElem.classList.contains('expanded')) {
            focusElem.classList.add('expanded');
            focusElem.setAttribute('aria-expanded', 'true');
          }
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          if (focusElem.classList.contains('collapsible') && focusElem.classList.contains('expanded')) {
            focusElem.classList.remove('expanded');
            focusElem.setAttribute('aria-expanded', 'false');
          }
        }
      });

      // Load example JSON on page load
      inputArea.value = `{
"name": "John Doe",
"age": 30,
"married": true,
"children": [
  {
    "name": "Jane",
    "age": 10
  },
  {
    "name": "Mark",
    "age": 5
  }
],
"address": {
  "street": "123 Main St",
  "city": "Anytown",
  "zipcode": "12345"
},
"hobbies": ["reading", "gaming", "hiking"],
"nullValue": null
}`;
    })();
  </script>
</body>
</html>
