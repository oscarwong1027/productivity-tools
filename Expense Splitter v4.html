<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
</script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Splitter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.10/babel.min.js"></script>
    <style>
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .hover-lift {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .hover-lift:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .input-focus {
            transition: all 0.2s ease-in-out;
        }
        .input-focus:focus {
            transform: scale(1.02);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-100 min-h-screen">
    <div id="root" className="min-h-screen flex items-center justify-center p-4 sm:p-6"></div>

    <script type="text/babel">
        function App() {
            const [peopleCount, setPeopleCount] = React.useState(0);
            const [people, setPeople] = React.useState([]);
            const [expenses, setExpenses] = React.useState([]);
            const [settlements, setSettlements] = React.useState([]);
            const [names, setNames] = React.useState([]);
            const [equalSplitMode, setEqualSplitMode] = React.useState(false);
            const [totalAmount, setTotalAmount] = React.useState('');
            const [selectedPeople, setSelectedPeople] = React.useState([]);

            const handlePeopleSubmit = (e) => {
                e.preventDefault();
                const count = parseInt(e.target.peopleCount.value);
                const newNames = Array.from(e.target.elements)
                    .filter(el => el.name.startsWith('name-'))
                    .map(el => el.value.trim() || `Person ${el.name.split('-')[1]}`);
                setPeopleCount(count);
                setPeople(newNames.map((name, i) => ({ id: i + 1, name })));
                setNames(newNames);
                setExpenses([]);
                setSettlements([]);
            };

            const handlePeopleCountChange = (e) => {
                const count = parseInt(e.target.value) || 0;
                setPeopleCount(count);
                setNames(Array(count).fill(''));
            };

            const handleNameChange = (index, value) => {
                const newNames = [...names];
                newNames[index] = value;
                setNames(newNames);
            };

            const handleEqualSplitToggle = () => {
                setEqualSplitMode(!equalSplitMode);
                setTotalAmount('');
                setSelectedPeople([]);
                // Clear manual amounts when switching modes
                people.forEach(person => {
                    const amountInput = document.querySelector(`input[name="amount-${person.id}"]`);
                    if (amountInput) amountInput.value = '';
                });
            };

            const handlePersonSelection = (personId) => {
                setSelectedPeople(prev => 
                    prev.includes(personId) 
                        ? prev.filter(id => id !== personId)
                        : [...prev, personId]
                );
            };

            const handleTotalAmountChange = (e) => {
                setTotalAmount(e.target.value);
                updateEqualSplitAmounts(e.target.value, selectedPeople);
            };

            const updateEqualSplitAmounts = (total, selected) => {
                if (!total || selected.length === 0) return;
                
                const amount = parseFloat(total) / selected.length;
                people.forEach(person => {
                    const amountInput = document.querySelector(`input[name="amount-${person.id}"]`);
                    if (amountInput) {
                        amountInput.value = selected.includes(person.id) ? amount.toFixed(2) : '';
                    }
                });
            };

            React.useEffect(() => {
                if (equalSplitMode && totalAmount && selectedPeople.length > 0) {
                    updateEqualSplitAmounts(totalAmount, selectedPeople);
                }
            }, [selectedPeople, totalAmount, equalSplitMode]);

            const addExpense = (e) => {
                e.preventDefault();
                const payerId = parseInt(e.target.payer.value);
                const description = e.target.description.value;
                const photo = e.target.photo.files[0];
                const sharedWith = Array.from(e.target.elements)
                    .filter(el => el.name.startsWith('amount-'))
                    .map(el => ({
                        personId: parseInt(el.name.split('-')[1]),
                        amount: parseFloat(el.value) || 0
                    }))
                    .filter(share => share.amount > 0);

                const totalExpenseAmount = sharedWith.reduce((sum, share) => sum + share.amount, 0);
                
                const newExpense = {
                    id: expenses.length + 1,
                    payerId,
                    description,
                    sharedWith,
                    totalAmount: totalExpenseAmount,
                    photo: photo ? URL.createObjectURL(photo) : null
                };

                const updatedExpenses = [...expenses, newExpense];
                setExpenses(updatedExpenses);
                calculateSettlements(updatedExpenses);
                
                // Reset form and states
                e.target.reset();
                setEqualSplitMode(false);
                setTotalAmount('');
                setSelectedPeople([]);
            };

            const removeExpense = (id) => {
                const updatedExpenses = expenses.filter(expense => expense.id !== id);
                setExpenses(updatedExpenses);
                calculateSettlements(updatedExpenses);
            };

            const calculateSettlements = (updatedExpenses) => {
                const balances = people.reduce((acc, person) => ({ ...acc, [person.id]: 0 }), {});
                
                updatedExpenses.forEach(expense => {
                    balances[expense.payerId] += expense.totalAmount;
                    expense.sharedWith.forEach(({ personId, amount }) => {
                        balances[personId] -= amount;
                    });
                });

                const settlements = [];
                Object.entries(balances).forEach(([id, balance]) => {
                    if (balance > 0.01) {
                        settlements.push({ text: `${people.find(p => p.id === parseInt(id)).name} is owed $${balance.toFixed(2)}`, type: 'owed' });
                    } else if (balance < -0.01) {
                        settlements.push({ text: `${people.find(p => p.id === parseInt(id)).name} owes $${Math.abs(balance).toFixed(2)}`, type: 'owes' });
                    }
                });
                setSettlements(settlements);
            };

            return (
                <div className="w-full max-w-5xl glass-effect rounded-3xl shadow-xl p-6 sm:p-10 mx-auto">
                    <div className="text-center mb-8">
                        <h1 className="text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-purple-600 to-blue-600 mb-2">
                            💰 Expense Splitter
                        </h1>
                        <p className="text-gray-600 text-sm sm:text-base">Split bills fairly and track expenses easily</p>
                    </div>
                    
                    <div className="space-y-8">
                        {/* People Setup Section */}
                        <div className="bg-gradient-to-r from-indigo-50 to-blue-50 p-6 rounded-2xl border border-indigo-100 hover-lift">
                            <div className="flex items-center mb-6">
                                <div className="w-8 h-8 bg-indigo-500 rounded-full flex items-center justify-center mr-3">
                                    <span className="text-white font-bold text-sm">1</span>
                                </div>
                                <h2 className="text-xl sm:text-2xl font-semibold text-indigo-800">👥 Set People</h2>
                            </div>
                            <form onSubmit={handlePeopleSubmit} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-indigo-700 mb-2">Number of People</label>
                                    <input
                                        type="number"
                                        name="peopleCount"
                                        min="2"
                                        max="20"
                                        required
                                        onChange={handlePeopleCountChange}
                                        className="input-focus block w-full sm:w-48 rounded-xl border-2 border-indigo-200 shadow-sm focus:border-indigo-500 focus:ring-0 text-sm p-3 bg-white"
                                        placeholder="e.g., 4"
                                    />
                                </div>
                                {peopleCount > 0 && (
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {Array.from({ length: peopleCount }).map((_, i) => (
                                                <div key={i}>
                                                    <label className="block text-sm font-medium text-indigo-700 mb-2">
                                                        Person {i + 1}
                                                    </label>
                                                    <input
                                                        type="text"
                                                        name={`name-${i + 1}`}
                                                        placeholder={`Enter name...`}
                                                        value={names[i] || ''}
                                                        onChange={(e) => handleNameChange(i, e.target.value)}
                                                        className="input-focus block w-full rounded-xl border-2 border-indigo-200 shadow-sm focus:border-indigo-500 focus:ring-0 text-sm p-3 bg-white"
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                {peopleCount > 0 && (
                                    <button
                                        type="submit"
                                        className="w-full sm:w-auto bg-gradient-to-r from-indigo-600 to-blue-600 text-white px-8 py-3 rounded-xl hover:from-indigo-700 hover:to-blue-700 transition-all duration-200 font-medium shadow-lg hover:shadow-xl"
                                    >
                                        ✅ Confirm People
                                    </button>
                                )}
                            </form>
                        </div>

                        {people.length > 0 && (
                            <>
                                {/* Add Expense Section */}
                                <div className="bg-gradient-to-r from-purple-50 to-pink-50 p-6 rounded-2xl border border-purple-100 hover-lift">
                                    <div className="flex items-center mb-6">
                                        <div className="w-8 h-8 bg-purple-500 rounded-full flex items-center justify-center mr-3">
                                            <span className="text-white font-bold text-sm">2</span>
                                        </div>
                                        <h2 className="text-xl sm:text-2xl font-semibold text-purple-800">💸 Add Expense</h2>
                                    </div>
                                    <form onSubmit={addExpense} className="space-y-6">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                            <div>
                                                <label className="block text-sm font-medium text-purple-700 mb-2">Description</label>
                                                <input
                                                    type="text"
                                                    name="description"
                                                    required
                                                    placeholder="e.g., Dinner at restaurant"
                                                    className="input-focus block w-full rounded-xl border-2 border-purple-200 shadow-sm focus:border-purple-500 focus:ring-0 text-sm p-3 bg-white"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-purple-700 mb-2">Paid By</label>
                                                <select
                                                    name="payer"
                                                    required
                                                    className="input-focus block w-full rounded-xl border-2 border-purple-200 shadow-sm focus:border-purple-500 focus:ring-0 text-sm p-3 bg-white"
                                                >
                                                    <option value="">Select person...</option>
                                                    {people.map(person => (
                                                        <option key={person.id} value={person.id}>
                                                            {person.name}
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-purple-700 mb-2">📷 Photo (Optional)</label>
                                            <input
                                                type="file"
                                                name="photo"
                                                accept="image/*"
                                                className="block w-full text-sm text-purple-700 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-medium file:bg-purple-100 file:text-purple-700 hover:file:bg-purple-200 file:transition-colors"
                                            />
                                        </div>
                                        
                                        {/* Equal Split Toggle */}
                                        <div className="bg-white p-5 rounded-xl border-2 border-purple-100 shadow-sm">
                                            <div className="flex items-center space-x-3 mb-4">
                                                <input
                                                    type="checkbox"
                                                    id="equalSplit"
                                                    checked={equalSplitMode}
                                                    onChange={handleEqualSplitToggle}
                                                    className="h-5 w-5 text-purple-600 focus:ring-purple-500 border-purple-300 rounded"
                                                />
                                                <label htmlFor="equalSplit" className="text-sm font-medium text-purple-700">
                                                    ⚖️ Equal Split Mode
                                                </label>
                                            </div>
                                            
                                            {equalSplitMode && (
                                                <div className="space-y-4">
                                                    <div>
                                                        <label className="block text-sm font-medium text-purple-700 mb-2">Total Amount</label>
                                                        <input
                                                            type="number"
                                                            step="0.01"
                                                            min="0"
                                                            value={totalAmount}
                                                            onChange={handleTotalAmountChange}
                                                            placeholder="Enter total amount"
                                                            className="input-focus block w-full sm:w-48 rounded-xl border-2 border-purple-200 shadow-sm focus:border-purple-500 focus:ring-0 text-sm p-3 bg-white"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-medium text-purple-700 mb-3">Select People to Split With</label>
                                                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
                                                            {people.map(person => (
                                                                <label key={person.id} className="flex items-center space-x-2 cursor-pointer p-2 rounded-lg hover:bg-purple-50 transition-colors">
                                                                    <input
                                                                        type="checkbox"
                                                                        checked={selectedPeople.includes(person.id)}
                                                                        onChange={() => handlePersonSelection(person.id)}
                                                                        className="h-4 w-4 text-purple-600 focus:ring-purple-500 border-purple-300 rounded"
                                                                    />
                                                                    <span className="text-sm text-purple-700 truncate">{person.name}</span>
                                                                </label>
                                                            ))}
                                                        </div>
                                                    </div>
                                                    {selectedPeople.length > 0 && totalAmount && (
                                                        <div className="text-sm text-purple-700 bg-purple-100 p-3 rounded-lg border border-purple-200">
                                                            <span className="font-medium">💡 Each person pays: </span>
                                                            <span className="font-bold text-purple-800">${(parseFloat(totalAmount) / selectedPeople.length).toFixed(2)}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-purple-700 mb-3">
                                                {equalSplitMode ? '💰 Amounts (Auto-calculated)' : '💰 Shared With & Amounts'}
                                            </label>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {people.map(person => (
                                                    <div key={person.id} className="flex items-center space-x-3 bg-white p-3 rounded-lg border border-purple-100">
                                                        <label className="text-sm font-medium text-purple-700 flex-1 truncate">{person.name}</label>
                                                        <div className="relative">
                                                            <span className="absolute left-3 top-1/2 transform -translate-y-1/2 text-purple-500 text-sm">$</span>
                                                            <input
                                                                type="number"
                                                                name={`amount-${person.id}`}
                                                                step="0.01"
                                                                min="0"
                                                                placeholder="0.00"
                                                                readOnly={equalSplitMode}
                                                                className={`w-24 pl-6 pr-2 py-2 rounded-lg border-2 border-purple-200 shadow-sm focus:border-purple-500 focus:ring-0 text-sm ${
                                                                    equalSplitMode ? 'bg-gray-50 text-gray-600' : 'bg-white input-focus'
                                                                }`}
                                                            />
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <button
                                            type="submit"
                                            className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 px-6 rounded-xl hover:from-purple-700 hover:to-pink-700 transition-all duration-200 font-medium shadow-lg hover:shadow-xl"
                                        >
                                            ➕ Add Expense
                                        </button>
                                    </form>
                                </div>

                                {/* Expenses List */}
                                <div className="bg-gradient-to-r from-green-50 to-teal-50 p-6 rounded-2xl border border-green-100">
                                    <div className="flex items-center mb-6">
                                        <div className="w-8 h-8 bg-green-500 rounded-full flex items-center justify-center mr-3">
                                            <span className="text-white font-bold text-sm">3</span>
                                        </div>
                                        <h2 className="text-xl sm:text-2xl font-semibold text-green-800">📋 Expenses</h2>
                                    </div>
                                    {expenses.length > 0 ? (
                                        <div className="space-y-4">
                                            {expenses.map(expense => (
                                                <div key={expense.id} className="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-500 hover-lift">
                                                    <div className="flex justify-between items-start">
                                                        <div className="flex-1">
                                                            <div className="flex items-center mb-2">
                                                                <h3 className="font-semibold text-green-800 text-lg">{expense.description}</h3>
                                                                <span className="ml-3 bg-green-100 text-green-800 text-xs font-medium px-2 py-1 rounded-full">
                                                                    ${expense.totalAmount.toFixed(2)}
                                                                </span>
                                                            </div>
                                                            <p className="text-sm text-green-600 mb-1">
                                                                💳 Paid by <span className="font-medium">{people.find(p => p.id === expense.payerId).name}</span>
                                                            </p>
                                                            <p className="text-sm text-green-600">
                                                                👥 Shared with: {expense.sharedWith.length > 0 
                                                                    ? expense.sharedWith.map(({ personId, amount }) => 
                                                                        `${people.find(p => p.id === personId).name} ($${amount.toFixed(2)})`).join(", ")
                                                                    : "No one"}
                                                            </p>
                                                            {expense.photo && (
                                                                <img src={expense.photo} alt="Receipt" className="mt-3 max-w-xs h-32 object-cover rounded-lg shadow-sm border border-green-200" />
                                                            )}
                                                        </div>
                                                        <button
                                                            onClick={() => removeExpense(expense.id)}
                                                            className="ml-4 text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition-colors font-medium text-sm"
                                                        >
                                                            🗑️ Remove
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center py-8">
                                            <div className="text-6xl mb-4">📝</div>
                                            <p className="text-green-600">No expenses added yet. Add your first expense above!</p>
                                        </div>
                                    )}
                                </div>

                                {/* Settlements */}
                                <div className="bg-gradient-to-r from-orange-50 to-yellow-50 p-6 rounded-2xl border border-orange-100">
                                    <div className="flex items-center mb-6">
                                        <div className="w-8 h-8 bg-orange-500 rounded-full flex items-center justify-center mr-3">
                                            <span className="text-white font-bold text-sm">4</span>
                                        </div>
                                        <h2 className="text-xl sm:text-2xl font-semibold text-orange-800">💸 Settlements</h2>
                                    </div>
                                    {settlements.length > 0 ? (
                                        <div className="grid gap-3">
                                            {settlements.map((settlement, index) => (
                                                <div 
                                                    key={index} 
                                                    className={`text-sm font-medium p-4 rounded-xl border-2 hover-lift ${
                                                        settlement.type === 'owed' 
                                                            ? 'bg-green-100 text-green-800 border-green-200' 
                                                            : 'bg-red-100 text-red-800 border-red-200'
                                                    }`}
                                                >
                                                    <div className="flex items-center">
                                                        <span className="text-lg mr-2">
                                                            {settlement.type === 'owed' ? '💰' : '💳'}
                                                        </span>
                                                        {settlement.text}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="text-center py-8">
                                            <div className="text-6xl mb-4">⚖️</div>
                                            <p className="text-orange-600">No settlements calculated yet. Add expenses to see who owes what!</p>
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
